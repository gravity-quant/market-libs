[project]
name = "market-data-client"
version = "0.1.0"
description = "Cliente HTTP (sync y async) para la API de market data (primary-extractor) con Auth0 client-credentials."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Sebastián de la Fuente", email = "sebadlf@gmail.com" }]
license = { text = "MIT" }
keywords = ["market-data", "auth0", "fintech", "argentina", "api-client", "primary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tenacity>=9.1.0,<10",  # Phase 20 CORE-MD-01 retries — mirror of iol D-15
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_client"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]
