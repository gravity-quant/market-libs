name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint y formato (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Verificar uv.lock sincronizado
        run: uv lock --check
      - name: Sync workspace
        run: uv sync --all-packages --all-extras --dev --frozen
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: import-linter (boundary enforcement, Phase 7 REFAC-03)
        run: uv run lint-imports
      - name: lint-logging (Phase 8 LOG-01 — no logging.basicConfig / logging.root in package src)
        run: |
          # Match actual code calls only, not docstring/comment references:
          #   logging.basicConfig(...)  — call with paren
          #   logging.root.<identifier> — attribute access (not bare "logging.root" in docstrings)
          if grep -rnE --include='*.py' 'logging\.basicConfig\s*\(|logging\.root\.\w' packages/*/src/; then
            echo "::error::Phase 8 LOG-01 violated — package source must not call logging.basicConfig or logging.root.*"
            exit 1
          fi
      - name: decode-intactness (Phase 29 DEC-01 — las 5 copias de `_decode.py` colapsan a un hash)
        # Cross-package por naturaleza: NO va al job `test`, que corre per-package.
        # Tampoco puede vivir bajo `verification/`: el job `test` pasa un path
        # explícito que pisa `testpaths`, así que ese directorio nunca corrió en CI.
        run: uv run python tools/check_decode_intactness.py
      - name: uniform-structure (Phase 31 TYP-03 — models.py + types.py en los 6 paquetes)
        # Cross-package por naturaleza: NO va al job `test`, que corre per-package.
        # Tampoco puede vivir bajo `verification/`: el job `test` pasa un path
        # explícito que pisa `testpaths`, así que ese directorio nunca corrió en CI.
        run: uv run python tools/check_uniform_structure.py
      - name: surface-types (Phase 32 GATE-TYP-01 — cero Any/dict[str, Any] en la superficie exportada)
        # Cross-package por naturaleza: NO va al job `test`, que corre per-package.
        # Tampoco puede vivir bajo `verification/`: el job `test` pasa un path
        # explícito que pisa `testpaths`, así que ese directorio nunca corrió en CI.
        # D-05: step en `lint`, NO job nuevo (Phase 31 D-12 supersede ROADMAP.md:25).
        run: uv run python tools/check_surface_types.py
      - name: driver locks de market-data y matriz (Phase 36 SC-5 + CR-01; Phase 37 CR-01)
        # Viven bajo `verification/`, que NUNCA corrió en CI por la misma razón
        # que documentan los tres steps de arriba: el job `test` pasa un path
        # explícito que pisa `testpaths`. Un guard nuevo metido ahí sería INERTE
        # — que es exactamente lo que el code review de la Phase 36 encontró
        # (WR-01) con el lock de deep-chain recién entregado. Se ejecutan acá,
        # siguiendo el precedente de los otros gates cross-cutting.
        #
        # Es una lista EXPLÍCITA, no `pytest verification/`: ese directorio
        # arrastra fallas pre-existentes ajenas a market-data (ver
        # `36-.../deferred-items.md`, backlog `HARN-VERIF-01`). Cada guard nuevo
        # se agrega a esta lista a mano.
        run: |
          uv run pytest -q \
            verification/test_main_market_data_deep_chain.py \
            verification/test_safemodel_diff_null_object_links.py \
            verification/test_main_matriz_risk_envelope_keys.py \
            verification/test_safemodel_diff_mapping_recursion.py \
            verification/test_main_verify_classification.py \
            verification/test_main_matriz_skip_line_shape.py

  pre-commit:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --all-extras --dev --frozen
      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Correr todos los hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --all-extras --dev --frozen
      - name: mypy (src global)
        run: uv run mypy
      - name: mypy (tests por paquete)
        run: |
          set -e
          for pkg in higyrus-client wallets-client matriz-client iol-client ambito-financiero-client market-data-client; do
            echo "::group::mypy packages/$pkg/tests"
            uv run mypy packages/$pkg/tests
            echo "::endgroup::"
          done

  test:
    name: Tests · ${{ matrix.package }} · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - higyrus-client
          - wallets-client
          - matriz-client
          - iol-client
          - ambito-financiero-client
          - market-data-client
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --all-extras --dev --frozen --python ${{ matrix.python-version }}
      - name: Tests del paquete
        run: |
          uv run --python ${{ matrix.python-version }} pytest \
            packages/${{ matrix.package }} \
            --cov=packages/${{ matrix.package }}/src \
            --cov-report=xml:coverage-${{ matrix.package }}.xml \
            --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: coverage-${{ matrix.package }}.xml
