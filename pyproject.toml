[project]
name = "market-libs"
version = "0.0.0"
description = "Monorepo de clientes HTTP para servicios financieros argentinos."
requires-python = ">=3.12"
readme = "README.md"
# El root del workspace no se publica: es solo un contenedor.
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
higyrus-client = { workspace = true }
wallets-client = { workspace = true }
matriz-client = { workspace = true }
iol-client = { workspace = true }
ambito-financiero-client = { workspace = true }
market-data-client = { workspace = true }

# Dependencias de desarrollo compartidas por todo el workspace.
# Se instalan con `uv sync` y aplican a cualquier paquete miembro.
[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "pre-commit>=4.0",
    "import-linter>=2.11,<3",  # Phase 7 REFAC-03 enforcement
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter para todo el monorepo.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests"]
# Phase 11 CR-08: spike artifacts (educational source dumps + spike workspaces)
# son contenido pre-formateado externo; no se le aplica ruff. Sin esta exclusión
# el job `lint` reporta 108 errores PRE-EXISTENTES que bloquean el CI green
# final (Phase 11 success criterion #5).
extend-exclude = [
    ".claude/skills/spike-findings-market-libs/sources/**",
    ".planning/spikes/**",
]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
    "ASYNC",    # flake8-async
    "PIE",      # flake8-pie
    "PT",       # flake8-pytest-style
    "RET",      # flake8-return
    "TID",      # flake8-tidy-imports
    "LOG",      # Phase 8 D-27 — flake8-logging plugin (LOG001..LOG015 — root-logger-call enforcement)
]
ignore = [
    "E501",  # line-too-long (formatter ya se encarga)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # asserts permitidos en tests
"packages/market-data-client/src/market_data_client/models.py" = ["N815"]  # campos wire camelCase (forward-safety, D-04)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy: configuración base. Cada paquete puede sobreescribir.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
explicit_package_bases = true
# El mypy global cubre el código fuente de cada paquete. Los tests se chequean
# por paquete (ej. `uv run mypy packages/iol-client/tests`) para evitar
# colisiones de módulos `conftest` entre paquetes.
files = ["packages/higyrus-client/src", "packages/wallets-client/src", "packages/matriz-client/src", "packages/iol-client/src", "packages/ambito-financiero-client/src"]

# ---------------------------------------------------------------------------
# Pytest: descubrimiento sobre todos los paquetes del workspace.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# `tests/` cubre el harness (`verification/` y otros módulos repo-internos
# no publicables); `packages/` cubre los clientes publicables.
testpaths = ["packages", "tests", "verification"]
# La raíz del repo va en sys.path para que los tests del harness puedan
# importar el módulo `verification/` (no publicable, vive en la raíz; Patrón 1).
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# importlib evita conflictos cuando hay `tests/conftest.py` en varios paquetes.
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]

[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# import-linter: boundary enforcement Phase 7 REFAC-03.
# Cada paquete tiene un módulo `_core.py` (pure builders/parsers) que NO debe
# importar ni `client.py` ni `aio.py` del mismo paquete. Los 4 contracts
# `forbidden` bloquean el re-coupling declarativamente; `lint-imports` corre
# como CI gate (.github/workflows/ci.yml).
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "ambito_financiero_client",
    "iol_client",
    "higyrus_client",
    "matriz_client",
]

[[tool.importlinter.contracts]]
name = "ambito_financiero_client._core does not depend on transport modules"
type = "forbidden"
source_modules = ["ambito_financiero_client._core"]
forbidden_modules = [
    "ambito_financiero_client.client",
    "ambito_financiero_client.aio",
]

[[tool.importlinter.contracts]]
name = "higyrus_client._core does not depend on transport modules"
type = "forbidden"
source_modules = ["higyrus_client._core"]
forbidden_modules = ["higyrus_client.client", "higyrus_client.aio"]

[[tool.importlinter.contracts]]
name = "iol_client._core does not depend on transport modules"
type = "forbidden"
source_modules = ["iol_client._core"]
forbidden_modules = ["iol_client.client", "iol_client.aio"]

[[tool.importlinter.contracts]]
name = "matriz_client._core does not depend on transport modules"
type = "forbidden"
source_modules = ["matriz_client._core"]
forbidden_modules = ["matriz_client.client", "matriz_client.aio"]
